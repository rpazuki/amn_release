[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amn"
version = "1.0.0"
description = "Artificial Metabolic Networks - Machine learning models for metabolic network predictions"
readme = "README.md"
requires-python = ">=3.7"
license = {file = "LICENSE"}
authors = [
    {name = "Jean-loup Faulon", email = "jfaulon@gmail.com"},
    {name = "Bastien Mollet"}
]
keywords = ["metabolic networks", "machine learning", "systems biology", "FBA", "cobra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pydoe2",
    "silence-tensorflow",
]

[project.optional-dependencies]
cobra = [
    "cobra",
]
tensorflow = [
    "tensorflow>=2.6",
    "keras>=2.6",
]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.setuptools]
packages = ["Library"]

[tool.setuptools.package-data]
Library = ["*.py"]
